name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Test platform-neutral core
        run: swift test

      - name: Build watchOS app without signing
        run: >-
          xcodebuild
          -project WatchMeDance.xcodeproj
          -scheme WatchMeDance
          -sdk watchsimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
